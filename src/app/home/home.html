<div class="h-screen overflow-y-hidden">
    <div class="grid grid-cols-5 h-full">
        <div
            class="col-span-1 bg-white dark:bg-slate-800 shadow-lg p-6 border-r border-slate-200 dark:border-slate-700 transition-all hover:shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Chat story</h2>
                <button
                    class="h-8 w-8 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 active:scale-95"
                    aria-label="Toggle sidebar">
                    <span class="material-symbols-outlined text-[20px]">
                        left_panel_close
                    </span>
                </button>
            </div>

            <div class="flex flex-col gap-3">
                <div class="text-sm text-slate-500 dark:text-slate-400 text-center py-8">
                    No messages yet
                </div>
            </div>
        </div>

        <div class="col-span-4 w-full">
            <app-three-layer #threelayerRef [cameraPosition]="{x: 0, y: 1.2, z: 1.5}"
                [controlRotation]="{x: 0, y: 1.2, z: 0}" />
        </div>
    </div>


    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 pointer-events-none w-full max-w-2xl px-4">
        <div
            class="pointer-events-auto flex flex-col bg-white/75 dark:bg-slate-900/75 backdrop-blur-xl rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-2xl hover:shadow-3xl focus-within:shadow-3xl focus-within:border-slate-300 dark:focus-within:border-slate-600 transition-all duration-300">
            <div class="flex flex-col gap-3.5 m-3.5">
                <div class="relative">
                    <div
                        class="max-h-96 w-full overflow-y-auto min-h-[1.5rem] scrollbar-thin scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-600">
                        <div contenteditableModel [(ngModel)]="message" role="textbox" aria-label="Write your prompt"
                            ngDefaultControl class="outline-none p-2 text-slate-900 dark:text-slate-100 min-h-[2.5rem]"
                            (keypress)="onKeyPress($event)" (input)="onInput($event)"
                            data-placeholder="How can I help you today?">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2.5 w-full items-center">
                    <div class="relative flex-1 flex items-center gap-2">
                        <button
                            class="h-9 w-9 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 active:scale-95"
                            aria-label="Attachments" (click)="onClick($event)">
                            <span class="material-icons-outlined text-[20px]">
                                add
                            </span>
                        </button>
                    </div>

                    <button
                        class="h-9 w-9 rounded-lg flex items-center justify-center bg-gradient-to-br from-indigo-600 to-indigo-700 text-white hover:from-indigo-700 hover:to-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed disabled:from-slate-400 disabled:to-slate-500 transition-all duration-200 active:scale-95 shadow-md hover:shadow-lg"
                        [disabled]="message().trim().length <= 0" (click)="sendMessage()" aria-label="Send message">
                        <span class="material-icons-outlined text-[20px]">
                            arrow_upward
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
