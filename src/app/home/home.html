<div class="">
    <div class="grid grid-cols-5 h-screen">
        <div
            class="col-span-1 bg-white dark:bg-slate-800 shadow-lg p-6 border-r border-slate-200 dark:border-slate-700 transition-all hover:shadow-xl">
            <h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100 mb-2">Chat story</h2>
        </div>

        <div class="col-span-4 w-full">
            <app-three-layer />
        </div>
    </div>


    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 pointer-events-auto w-full max-w-2xl px-4">
        <div
            class="flex flex-col bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg hover:shadow-xl focus-within:shadow-xl transition-all">
            <div class="flex flex-col gap-3.5 m-3.5">
                <div class="relative">
                    <div class="max-h-96 w-full overflow-y-auto min-h-[1.5rem]">
                        <div contenteditableModel [(ngModel)]="message" role="textbox" aria-label="Write your prompt"
                            ngDefaultControl class="outline-none p-2 text-slate-900 dark:text-slate-100"
                            data-placeholder="Reply...">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2.5 w-full items-center">
                    <div class="relative flex-1 flex items-center gap-2">
                        <button
                            class="h-8 w-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95"
                            aria-label="Attachments">
                            <span class="material-icons-outlined">
                                add
                            </span>
                        </button>

                    </div>

                    <button
                        class="h-8 w-8 rounded-lg flex items-center justify-center bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-95"
                        [disabled]="message().trim().length <= 0" (click)="sendMessage()" aria-label="Send message">
                        <span class="material-icons-outlined">
                            arrow_upward
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
